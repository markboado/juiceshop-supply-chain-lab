name: Supply Chain Security

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Install dependencies without executing lifecycle scripts.
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts

      # Install Syft and Grype directly to avoid third-party action wrappers.
      - name: Install Syft and Grype
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail

          syft dir:./node_modules \
            --exclude "" \
            -o spdx-json \
            > juiceshop.sbom.spdx.json

          test -s juiceshop.sbom.spdx.json
          ls -lh juiceshop.sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: juiceshop-sbom-spdx
          path: juiceshop.sbom.spdx.json
          if-no-files-found: error
